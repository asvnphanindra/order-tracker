apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: ["alertname"]
    group_wait: 0s
    group_interval: 30s
    repeat_interval: 5m

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: OrderTracker5xx
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "5xx responses on {{ $labels.http_route }} in the last 2 minutes"
          endpoint: "{{ $labels.http_route }}"
          window: "2m"
          dashboard_url: "http://localhost:3000/d/order-tracker-observability?viewPanel=2"
          __dashboardUid__: order-tracker-observability
          __panelId__: "2"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: sum by (http_route) (increase(order_tracker_requests_total{http_status_code=~"5.."}[2m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
